                federation, quarkus, keycloak, iam, kubernetes, data platform, llm, agentic,
                mcp, rag, engineering manager, engineering leadership, architecture, java]
  hn_queries: [OSDU, data virtualization, Quarkus, Keycloak, engineering management,
               seismic data, energy data, agentic AI enterprise, MCP security]
  subreddits: [ExperiencedDevs, EngineeringManagers, dataengineering, java, oilandgasworkers]
  reddit_queries: [data platform, engineering manager, OSDU, Keycloak, Quarkus, AI agents]
  github_queries:
