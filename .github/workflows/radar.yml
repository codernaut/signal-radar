name: signal-radar

on:
  schedule:
    - cron: "17 3 * * *"        # 08:17 Pakistan time, daily
  workflow_dispatch: {}          # "Run workflow" button for a manual run

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # State (what you've already seen + LinkedIn daily budget) lives in the Actions
      # cache, never in the repo, so nothing about your search is committed.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .radar
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Build and email digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_PROFILE: ${{ secrets.RADAR_PROFILE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .radar
          key: radar-state-${{ github.run_id }}

      # Only keep a downloadable copy when the repo is private: in a public repo,
      # artifacts are visible to anyone.
      - name: Keep digest copy (private repos only)
        if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digest.html
          retention-days: 14
